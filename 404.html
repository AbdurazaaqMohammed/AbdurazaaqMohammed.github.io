<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 - Page Not Found</title>
	<link rel="icon" type="image/svg+xml" href="favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca&display=swap" rel="stylesheet">
	<style>
		body {
			font-family: "Lexend Deca", sans-serif;
			background: linear-gradient(180deg, #0a0e27, #1e1b4b, #312e81);
			color: #e0e6ed;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			text-align: center;
			margin: 0;
		}
		h1 {
			font-size: 5rem;
			font-weight: 300;
			color: #6366f1;
			margin-bottom: 10px;
		}
		p {
			font-size: 1.2rem;
			color: #a0aec0;
			margin-bottom: 24px;
		}
		a {
			color: #818cf8;
			text-decoration: none;
			padding: 12px 28px;
			border: 1px solid rgba(99, 102, 241, 0.4);
			border-radius: 8px;
			transition: all 0.3s ease;
		}
		a:hover {
			background: rgba(99, 102, 241, 0.15);
			border-color: rgba(99, 102, 241, 0.7);
			color: #fff;
		}
	</style>
	<script>
		(function() {
			const currentPath = window.location.pathname;
			if (currentPath.startsWith('/website/')) {
				window.location.replace(window.location.origin + currentPath.replace(/^\/website\//, '/') + window.location.search + window.location.hash);
			}
		})();
	</script>
</head>
<body>
	<div>
		<h1>404</h1>
		<p>That page doesn't exist.</p>
		<a href="index.html">Back to home</a>
	</div>
</body>
</html>
